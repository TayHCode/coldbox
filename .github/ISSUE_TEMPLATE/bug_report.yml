name: Bug report
description: Report a reproducible problem
body:
  - type: markdown
    attributes:
      value: Do not include tokens, private hostnames, IP addresses or personal paths. Report security problems as described in SECURITY.md.
  - type: textarea
    id: what-happened
    attributes:
      label: What happened, and what did you expect?
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Steps to reproduce
      description: The commands you ran, and the output of `coldbox status`.
    validations:
      required: true
  - type: input
    id: host
    attributes:
      label: Host OS and Incus version
      placeholder: Ubuntu 24.04, Incus 6.0.5
    validations:
      required: true
